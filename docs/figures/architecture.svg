" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Authority (trust anchor)</text><text x="496" y="200" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">verifiable credentials · revocation</text><rect x="480" y="244" width="220" height="70" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><rect x="480" y="244" width="5" height="70" rx="2" fill="#4f46e5" stroke="#4f46e5" stroke-width="0"/><text x="496" y="266" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Federated catalog</text><text x="496" y="284" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">signed DCAT 3 offers · ODRL 2.2</text><rect x="480" y="412" width="220" height="70" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><rect x="480" y="412" width="5" height="70" rx="2" fill="#4f46e5" stroke="#4f46e5" stroke-width="0"/><text x="496" y="434" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Transparency log</text><text x="496" y="452" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Merkle tree · RFC 9162 proofs</text><text x="590" y="368" font-size="11.5" font-weight="400" fill="#4f46e5" text-anchor="middle" font-style="italic">no data path</text><polyline points="480,195.0 360,195.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline points="700,195.0 820,195.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="miter" marker-end="url(#arrow)"/><text x="420" y="187.0" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">credentials</text><text x="760" y="187.0" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">credentials</text><polyline points="360,279.0 480,279.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline points="820,279.0 700,279.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin=