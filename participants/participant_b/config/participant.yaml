# Participant B — research institute (consumer of clinical data, provider of open mobility data).
participant:
  name: Forschungsinstitut B
  organization: Research Institute B
  endpoint: http://connector-b:8000

  datasets:
    - id: urban-mobility-2024
      title: Urban mobility counts 2024
      description: Hourly bike and pedestrian counts per sensor.
      keywords: [mobility, smart-city, sensors]
      media_type: text/csv
      sensitivity: public
      license: CC-BY-4.0
      source: data/mobility.csv
      rules:
        - id: open-use
          type: permission
          actions: [read, use, reproduce, aggregate]
          constraints:
            - {left_operand: participant.member, operator: eq, right_operand: true}
          duties:
            - {action: attribute}
