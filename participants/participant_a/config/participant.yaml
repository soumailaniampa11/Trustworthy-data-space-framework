# Participant A — university hospital (provider of clinical data).
# Attributes such as country or certifications are NOT declared here: they
# are attested by the authority as verifiable credentials.
participant:
  name: Hôpital Universitaire A
  organization: University Hospital A
  endpoint: http://connector-a:8000

  datasets:
    - id: clinical-records-2024
      title: Pseudonymised clinical records 2024
      description: Admissions, diagnoses (ICD-10) and length of stay.
      keywords: [health, clinical, icd10]
      media_type: text/csv
      sensitivity: confidential
      license: research-only
      source: data/clinical_records.csv
      rules:
        - id: eu-certified-research
          type: permission
          actions: [read, aggregate]
          constraints:
            - {left_operand: participant.region, operator: eq, right_operand: EU}
            - {left_operand: participant.certifications, operator: hasPart, right_operand: iso27001}
            - {left_operand: purpose, operator: isAnyOf, right_operand: [research, public-health]}
            - {left_operand: usage_count, operator: lt, right_operand: 10}
          duties:
            - {action: delete, parameters: {after_days: 30}}
            - {action: attribute}
        - id: no-copy-no-redistribution
          type: prohibition
          actions: [reproduce, distribute]
