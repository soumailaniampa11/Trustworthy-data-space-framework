[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthy-data-space"
version = "0.1.0"
description = "Research prototype of a trustworthy, sovereign data space"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["dataspace*", "api*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
